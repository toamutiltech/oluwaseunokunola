name: CI Pipeline

on:
  push:
    branches: [main, develop, "chore/*", "feat/*", "fix/*", "refactor/*"]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c38000445c58f61588437d31 # v4.1.0
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Prettier Code Format Check
        run: npm run format:check

      - name: Code Quality & Lint Check
        run: npm run lint

      - name: Type Safety Verification
        run: npm run typecheck

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high || true

  test-and-build:
    name: Test Suite & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c38000445c58f61588437d31 # v4.1.0
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Run Test Coverage Audit
        run: npm run test:coverage

      - name: Production Build Verification
        run: npm run build
